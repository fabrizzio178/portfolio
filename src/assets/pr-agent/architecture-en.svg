  <g font-size="11" fill="#767f87">
    <text x="540" y="318" text-anchor="middle">docs only: no reviewer runs</text>
    <text x="940" y="204" text-anchor="middle" font-size="10">below HIGH</text>
  </g>
  <g font-size="11" fill="#ff9a5e">
    <text x="873" y="234">HIGH</text>
    <text x="1023" y="300">approved</text>
    <text x="1023" y="315">or rejected</text>
  </g>

  <g stroke="#383e43" stroke-width="1.5" fill="#1a1c1f">
    <rect x="20" y="150" width="110" height="40" rx="20"/>
    <rect x="160" y="150" width="110" height="40" rx="8"/>
    <rect x="300" y="150" width="120" height="40" rx="8"/>
    <rect x="460" y="60" width="160" height="40" rx="8"/>
    <rect x="460" y="150" width="160" height="40" rx="8"/>
    <rect x="460" y="240" width="160" height="40" rx="8"/>
    <rect x="660" y="150" width="120" height="40" rx="8"/>
    <rect x="960" y="150" width="110" height="40" rx="8"/>
    <rect x="790" y="270" width="150" height="40" rx="8"/>
  </g>
  <g stroke="#ff7a33" stroke-width="1.5" fill="#1a1c1f">
    <rect x="810" y="150" width="110" height="40" rx="8"/>
    <rect x="790" y="370" width="150" height="40" rx="8" stroke-dasharray="6 4"/>
  </g>

  <g font-size="13" fill="#e7e9eb" text-anchor="middle">
    <text x="75" y="175">pull request</text>
    <text x="215" y="175">ingest</text>
    <text x="360" y="175">supervisor</text>
    <text x="540" y="85">static_analysis</text>
    <text x="540" y="175">security</text>
    <text x="540" y="265">code_arch</text>
    <text x="720" y="175">aggregator</text>
    <text x="865" y="175">risk gate</text>
    <text x="1015" y="175">post</text>
    <text x="865" y="295">notify_pending</text>
    <text x="865" y="395">human_review</text>
  </g>

  <g font-size="10" fill="#767f87" text-anchor="middle">
    <text x="215" y="207">diff + repo config</text>
    <text x="360" y="143">routes by file type</text>
    <text x="540" y="52">ruff · no LLM</text>
    <text x="540" y="142">LLM · structured output</text>
    <text x="540" y="297">LLM · structured output</text>
    <text x="720" y="143">dedupe + rank</text>
    <text x="1015" y="143">summary + inline</text>
  </g>
  <g font-size="10" fill="#ff9a5e" text-anchor="middle">
    <text x="865" y="427">interrupt() · graph suspended</text>
  </g>

  <g font-size="12">
    <rect x="20" y="452" width="10" height="10" rx="2" fill="#767f87"/>
    <text x="40" y="462" fill="#a4acb3">Job "analyze": runs the graph until interrupt() and uploads the SQLite checkpoint as an artifact.</text>
    <rect x="20" y="478" width="10" height="10" rx="2" fill="#ff7a33"/>
    <text x="40" y="488" fill="#a4acb3">Job "approve": waits for a maintainer in a protected GitHub Environment, then resumes the same thread.</text>
  </g>
