<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#767f87"/>
    </marker>
    <marker id="arrow-ember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff7a33"/>
    </marker>
  </defs>

  <rect width="1100" height="520" rx="16" fill="#101214"/>

  <g fill="none" stroke="#767f87" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M130 170 H158"/>
    <path d="M270 170 H298"/>
    <path d="M420 170 H458"/>
    <path d="M420 160 C440 160 438 80 458 80"/>
    <path d="M420 180 C440 180 438 260 458 260"/>
    <path d="M620 80 C642 80 638 160 658 160"/>
    <path d="M620 170 H658"/>
    <path d="M620 260 C642 260 638 180 658 180"/>
    <path d="M780 170 H808"/>
    <path d="M920 170 H958"/>
    <path d="M360 190 V325 H720 V192" stroke-dasharray="5 5"/>
    <path d="M865 310 V368"/>
  </g>
  <g fill="none" stroke="#ff7a33" stroke-width="1.5" marker-end="url(#arrow-ember)">
    <path d="M865 190 V268"/>
    <path d="M940 390 H1015 V192"/>
