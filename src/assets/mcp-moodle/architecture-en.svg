<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#767f87"/>
    </marker>
    <marker id="arrow-ember" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff7a33"/>
    </marker>
  </defs>

  <rect width="1100" height="520" rx="16" fill="#101214"/>

  <g fill="none" stroke="#767f87" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <path d="M262 150 H348"/>
    <path d="M752 150 H838"/>
  </g>
  <g font-size="11" fill="#767f87" text-anchor="middle">
    <text x="305" y="140">MCP · stdio</text>
    <text x="795" y="140">HTTPS · token</text>
  </g>

  <g stroke="#383e43" stroke-width="1.5" fill="#1a1c1f">
    <rect x="40" y="105" width="220" height="90" rx="10"/>
    <rect x="840" y="105" width="220" height="90" rx="10"/>
    <rect x="375" y="130" width="160" height="44" rx="8" fill="#101214"/>
    <rect x="565" y="130" width="160" height="44" rx="8" fill="#101214"/>
  </g>
  <rect x="350" y="70" width="400" height="130" rx="12" fill="none" stroke="#ff7a33" stroke-width="1.5"/>

  <g font-size="14" fill="#e7e9eb" text-anchor="middle">
    <text x="150" y="146">MCP client</text>
    <text x="950" y="146">Moodle REST API</text>
    <text x="455" y="157" font-size="13">tools/</text>
    <text x="645" y="157" font-size="13">api/ MoodleClient</text>
  </g>
  <text x="550" y="100" font-size="14" fill="#ff9a5e" text-anchor="middle">mcp-moodle · FastMCP</text>
  <g font-size="10" fill="#767f87" text-anchor="middle">
    <text x="150" y="168">Claude Desktop · Claude Code</text>
    <text x="950" y="168">university virtual classroom</text>
    <text x="455" y="190">13 tools, one per area</text>
    <text x="645" y="190">the only layer that speaks HTTP</text>
  </g>

  <text x="40" y="262" font-size="12" fill="#a4acb3">What the assistant can ask for</text>
  <g stroke="#383e43" stroke-width="1" fill="#1a1c1f">
    <rect x="40" y="280" width="240" height="34" rx="8"/>
    <rect x="300" y="280" width="240" height="34" rx="8"/>
    <rect x="560" y="280" width="240" height="34" rx="8"/>
    <rect x="820" y="280" width="240" height="34" rx="8"/>
    <rect x="40" y="328" width="240" height="34" rx="8"/>
    <rect x="300" y="328" width="240" height="34" rx="8"/>
    <rect x="560" y="328" width="240" height="34" rx="8"/>
    <rect x="820" y="328" width="240" height="34" rx="8"/>
  </g>
  <g font-size="12" fill="#cbd0d4" text-anchor="middle">
    <text x="160" y="302">pending assignments</text>
    <text x="420" y="302">upcoming deadlines</text>
    <text x="680" y="302">grades and feedback</text>
    <text x="940" y="302">quizzes and attempts</text>
    <text x="160" y="350">course content</text>
    <text x="420" y="350">announcements</text>
    <text x="680" y="350">unread notifications</text>
    <text x="940" y="350">PDF / Word files as text</text>
  </g>

  <g font-size="12">
    <rect x="40" y="412" width="10" height="10" rx="2" fill="#767f87"/>
    <text x="60" y="422" fill="#a4acb3">Read-only by design: no automatic assignment submission, for academic integrity.</text>
    <rect x="40" y="438" width="10" height="10" rx="2" fill="#ff7a33"/>
    <text x="60" y="448" fill="#a4acb3">A single write tool (choosing a group or exam slot), used only when the user asks explicitly.</text>
    <rect x="40" y="464" width="10" height="10" rx="2" fill="#767f87"/>
    <text x="60" y="474" fill="#a4acb3">The server ships no model: the client's model decides which tool to call.</text>
  </g>
</svg>
